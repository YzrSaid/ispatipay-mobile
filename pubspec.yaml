name: ispatipay
description: A Flutter mobile app to download and stream Spotify music via Telegram bot.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # HTTP & Networking
  http: ^1.1.0

  # Storage
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1

  # UI
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0

  # Audio Player
  just_audio: ^0.9.36
  audio_service: ^0.18.12

  # File management
  open_file: ^3.3.2
  share_plus: ^7.2.1

  # Utilities
  url_launcher: ^6.2.2
  flutter_dotenv: ^5.1.0
  permission_handler: ^11.0.1
  dio: ^5.4.0
  ffi: ^2.1.3

  # Telegram (via HTTP API — no native Telethon in Flutter)
  # We'll implement our own HTTP service layer

  cupertino_icons: ^1.0.2
  lottie: ^3.0.0
  just_audio_media_kit: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
